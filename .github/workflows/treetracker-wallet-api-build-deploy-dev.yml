# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Deploy to Dev Env

on:
  push:
    branches:
      - master

env:
  project-directory: ./

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      !contains(github.event.head_commit.message, 'skip-ci') &&
      github.event_name == 'push' &&
      github.repository == 'Greenstand/treetracker-wallet-api'
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic-release.outputs.new-release-version }}
      new-release-git-tag: ${{ steps.semantic-release.outputs.new-release-git-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - run: npm i -g semantic-release @semantic-release/{git,exec,changelog}
      - name: Run semantic-release
        id: semantic-release
        run: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and push release image
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new-release-git-tag }}
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: npm clean install
        run: npm ci
        working-directory: ${{ env.project-directory }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build snapshot with git sha and push on merge
        id: docker_build_snapshot_merge
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: greenstand/treetracker-wallet-api:${{ needs.release.outputs.new-release-version }}

  deploy:
    name: Deploy latest to development environment
    runs-on: ubuntu-latest
    needs: [release, build]
    if: needs.release.outputs.new-release-published == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new-release-git-tag }}

      - name: Install kustomize
        run: curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash

      - name: Run kustomize
        env:
          IMAGE_TAG: ${{ needs.release.outputs.new-release-version }}
        run: |
          cd deployment/overlays/development
          ../../../kustomize edit set image "greenstand/treetracker-wallet-api:${IMAGE_TAG}"

      - name: Install doctl for kubernetes
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DEV_DIGITALOCEAN_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DEV_CLUSTER_NAME}}

      - name: Delete completed migration jobs prior to deployment
        run: kubectl -n wallet-api delete job --ignore-not-found=true  wallet-db-migration-job

      - name: Update kubernetes resources
        run: kustomize build deployment/overlays/development | kubectl apply -n ${{ secrets.K8S_NAMESPACE }} --wait -f -
  #    - name: Attempt to wait for migration job to complete
  #       run: kubectl wait --for=condition=complete --timeout=45s job/wallet-db-migration-job

  test:
    name: End to End Test
    runs-on: ubuntu-latest
    needs: [release, deploy]
    if: needs.release.outputs.new-release-published == 'true'
    env:
      ENVIRONMENT: dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new-release-git-tag }}

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install mocha
        run: npm install -g mocha

      - run: npm ci

      - run: echo ${{ secrets.DEVELOPMENT_ENV }}

      - run: ${{ secrets.DEVELOPMENT_ENV }} npm run test-e2e
